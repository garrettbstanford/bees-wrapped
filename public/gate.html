<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Salt Lake Bees</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gate.css">
<script src="/gate.js" defer></script>
</head>
<body>
<main class="gate">
  <div class="honeycomb" aria-hidden="true"></div>
  <header class="brand">
    <span class="wordmark" role="img" aria-label="Salt Lake Bees"></span>
    <span class="eyebrow">Proof of Concept</span>
  </header>
  <section class="entry" aria-labelledby="gate-title">
    <svg class="lock" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="14" width="18" height="14" rx="4"/><path d="M11 14V9a5 5 0 0110 0v5"/><path d="M16 19v4" stroke-linecap="round"/></svg>
    <h1 id="gate-title">Enter password</h1>
    <p class="intro" id="gate-description">Enter the password to continue.</p>
    <form id="access-form" aria-describedby="gate-description" method="post" action="/__auth">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required maxlength="128" aria-describedby="form-message" autocapitalize="none" spellcheck="false">
        <button class="reveal" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 3 16 18"/></svg>
        </button>
      </div>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
      <button class="enter" type="submit"><span>Continue</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <noscript><p class="noscript">Please enable JavaScript to enter the proof of concept.</p></noscript>
    </form>
  </section>
</main>
</body>
</html>
